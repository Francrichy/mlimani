version: "3.9"

services:
  app:
    build: .
    ports:
      - "3847:3847"
    environment:
      PORT: 3847
      PAYMENT_DEMO: "true"
      NOTIFY_DEMO: "true"
      JWT_SECRET: change-me-in-production
      APP_URL: http://localhost:3847
      # DATABASE_URL: postgres://mlimani:mlimani@db:5432/mlimanifleet
      # SELCOM_VENDOR_ID:
      # SELCOM_API_KEY:
      # SELCOM_API_SECRET:
      # PAWAPAY_API_TOKEN:
      # PAWAPAY_ENV: sandbox
      # AT_USERNAME:
      # AT_API_KEY:
    volumes:
      - mf-data:/app/data
    restart: unless-stopped
    # depends_on:
    #   - db

  # Uncomment for PostgreSQL
